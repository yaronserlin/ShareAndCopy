<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo_v2.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Share & Copy</title>

  <!-- Installed-app metadata. `viewport-fit=cover` above, together with
       the safe-area insets used in the stylesheet, keeps the layout
       clear of the notch and home indicator in standalone mode. -->
  <meta name="description" content="Send files and text straight between your own devices, peer to peer." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS installs the app from these rather than the manifest. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Share&Copy" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <script src="/env-config.js" defer></script>

  <style>
    /* Shown until React mounts and replaces #root's content - without
       it, a slow first load (a cold-starting backend, a slow mobile
       connection scanning a QR code) is a bare white page rather than
       a page that's visibly doing something. */
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #f8f9fa;
      color: #6c757d;
      font-family: system-ui, -apple-system, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      #boot-loader {
        background: #212529;
        color: #adb5bd;
      }
    }

    #boot-loader .spinner {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      border: 3px solid rgba(79, 70, 229, 0.25);
      border-top-color: #4F46E5;
      animation: boot-spin 0.8s linear infinite;
    }

    @keyframes boot-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="boot-loader">
      <div class="spinner" role="status" aria-label="Loading"></div>
      <span>Loading Share &amp; Copy&hellip;</span>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>

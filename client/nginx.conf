# Serves the built client and proxies the API and Socket.IO onto the same
# origin. Running both behind one hostname is what makes the auth cookies
# first-party: cross-site cookies are routinely dropped by browsers with
# third-party-cookie protection, so on a split-origin deployment they are
# only a fallback behind the Authorization header (see docs/PWA.md).
#
# `server:5000` is the backend's address on the container network -
# replace it with the backend URL for your deployment.

upstream api_upstream {
    server server:5000;
}

server {
    listen 80;

    # The service worker must never be served from cache, or a deployed
    # update can take an extra visit to be noticed.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO needs the upgrade headers and a long read timeout, or the
    # WebSocket is downgraded to polling and idle connections are cut.
    location /socket.io/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
